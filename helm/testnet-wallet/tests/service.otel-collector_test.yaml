suite: testnet-wallet otel-collector - service
templates:
  - service.otel-collector.yaml
set:
  fullnameOverride: test-testnet-wallet
release:
  name: test-testnet-wallet
tests:
  - it: 'a collector Service is created by default'
    asserts:
      - hasDocuments:
          count: 1
      - isKind:
          of: Service
      - equal:
          path: metadata.name
          value: test-testnet-wallet-otel-collector
      - equal:
          path: spec.type
          value: ClusterIP

  - it: 'no Service is created when the collector is disabled'
    set:
      otelCollector:
        enabled: false
    asserts:
      - hasDocuments:
          count: 0

  - it: 'the Service selects the collector pods, not the whole release'
    asserts:
      - equal:
          path: spec.selector
          value:
            app.kubernetes.io/name: test-testnet-wallet-otel-collector
            app.kubernetes.io/instance: test-testnet-wallet

  - it: 'the OTLP port the wallet dials is exposed'
    asserts:
      - contains:
          path: spec.ports
          content:
            name: otlp-grpc
            port: 4317
            targetPort: otlp-grpc
            protocol: TCP

  - it: 'both scrape ports are exposed for the ServiceMonitor'
    asserts:
      - contains:
          path: spec.ports
          content:
            name: metrics
            port: 8889
            targetPort: metrics
            protocol: TCP
      - contains:
          path: spec.ports
          content:
            name: telemetry
            port: 8888
            targetPort: telemetry
            protocol: TCP
