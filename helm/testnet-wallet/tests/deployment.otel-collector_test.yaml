suite: testnet-wallet otel-collector - deployment
templates:
  - deployment.otel-collector.yaml
set:
  fullnameOverride: test-testnet-wallet
release:
  name: test-testnet-wallet
tests:
  - it: 'a collector Deployment is created by default'
    asserts:
      - hasDocuments:
          count: 1
      - isKind:
          of: Deployment
      - equal:
          path: metadata.name
          value: test-testnet-wallet-otel-collector

  - it: 'no Deployment is created when the collector is disabled'
    set:
      otelCollector:
        enabled: false
    asserts:
      - hasDocuments:
          count: 0

  - it: 'the image tag is pinned, not taken from the chart appVersion'
    asserts:
      - equal:
          path: spec.template.spec.containers[0].image
          value: ghcr.io/open-telemetry/opentelemetry-collector-releases/opentelemetry-collector-contrib:0.162.0

  - it: 'versionOverride does not reach the collector image'
    set:
      versionOverride: v1.2.3
    asserts:
      - equal:
          path: spec.template.spec.containers[0].image
          value: ghcr.io/open-telemetry/opentelemetry-collector-releases/opentelemetry-collector-contrib:0.162.0

  - it: 'the collector runs its config from the mounted ConfigMap'
    asserts:
      - equal:
          path: spec.template.spec.containers[0].command
          value:
            - /otelcol-contrib
      - equal:
          path: spec.template.spec.containers[0].args
          value:
            - --config=/conf/config.yaml
      - contains:
          path: spec.template.spec.containers[0].volumeMounts
          content:
            name: otel-collector-config
            mountPath: /conf
            readOnly: true
      - contains:
          path: spec.template.spec.volumes
          content:
            name: otel-collector-config
            configMap:
              name: test-testnet-wallet-otel-collector

  - it: 'extra volumes are added alongside the config volume, not instead of it'
    set:
      otelCollector:
        volumes:
          - name: scratch
            emptyDir: {}
    asserts:
      - lengthEqual:
          path: spec.template.spec.volumes
          count: 2
      - contains:
          path: spec.template.spec.volumes
          content:
            name: otel-collector-config
            configMap:
              name: test-testnet-wallet-otel-collector

  - it: 'every port the config listens on is declared on the container'
    asserts:
      - contains:
          path: spec.template.spec.containers[0].ports
          content:
            name: otlp-grpc
            containerPort: 4317
            protocol: TCP
      - contains:
          path: spec.template.spec.containers[0].ports
          content:
            name: metrics
            containerPort: 8889
            protocol: TCP
      - contains:
          path: spec.template.spec.containers[0].ports
          content:
            name: telemetry
            containerPort: 8888
            protocol: TCP
      - contains:
          path: spec.template.spec.containers[0].ports
          content:
            name: health
            containerPort: 13133
            protocol: TCP

  - it: 'the probes target the health_check extension'
    asserts:
      - equal:
          path: spec.template.spec.containers[0].livenessProbe.httpGet
          value:
            path: /
            port: health
      - equal:
          path: spec.template.spec.containers[0].readinessProbe.httpGet
          value:
            path: /
            port: health

  - it: 'the pod template carries a hash of the collector config, so a config change rolls the pods'
    asserts:
      - matchRegex:
          path: spec.template.metadata.annotations['ilf-otel-collector-config-sha256']
          pattern: '^[0-9a-f]{64}$'
