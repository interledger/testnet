suite: testnet-wallet backend - Backend Deployment
templates:
  - configMap.backend.yaml
  - deployment.backend.yaml
set:
  fullnameOverride: test-testnet-wallet
release:
  name: test-testnet-wallet
tests:
  - it: 'deployment name should be test-testnet-wallet-backend'
    asserts:
      - equal:
          path: metadata.name
          value: test-testnet-wallet-backend
  - it: 'when overriding tag on the deployment, the container should use that tag'
    template: deployment.backend.yaml
    set:
      deployments:
        backend:
          image:
            tag: 2.0.0
    asserts:
      - equal:
          path: spec.template.spec.containers[0].image
          value: ghcr.io/interledger/test-wallet-backend:2.0.0
  - it: 'given that no tag is on the deployment definition, when overriding the tag globally, the container should use that tag'
    template: deployment.backend.yaml
    set:
      imageOverride:
        tag: 2.0.0
    asserts:
      - equal:
          path: spec.template.spec.containers[0].image
          value: ghcr.io/interledger/test-wallet-backend:2.0.0
  - it: 'should create configmap with correct environment variables'
    template: configMap.backend.yaml
    asserts:
      - equal:
          path: metadata.name
          value: test-testnet-wallet-backend
      - equal:
          path: data.NODE_ENV
          value: production
      - equal:
          path: data.PORT
          value: '4003'
      - equal:
          path: data.METRICS_PORT
          value: '9464'
      - equal:
          path: data.COOKIE_NAME
          value: testnet.cookie
  - it: 'should expose the metrics port on the container'
    template: deployment.backend.yaml
    asserts:
      - equal:
          path: spec.template.spec.containers[0].ports[1].name
          value: metrics
      - equal:
          path: spec.template.spec.containers[0].ports[1].containerPort
          value: 9464
  - it: 'should handle accessSepaKey as a config'
    template: configMap.backend.yaml
    set:
      config:
        backend:
          gatehub:
            accessSepaKey: test-sepa-access-key
    asserts:
      - equal:
          path: data.GATEHUB_SEPA_ACCESS_KEY
          value: test-sepa-access-key
  - it: 'secret references default to the Secret this chart names'
    template: deployment.backend.yaml
    asserts:
      - equal:
          path: spec.template.spec.containers[0].env[0].valueFrom.secretKeyRef.name
          value: test-testnet-wallet-backend
  - it: 'secret references follow config.backend.secretName when it is set'
    template: deployment.backend.yaml
    set:
      config:
        backend:
          secretName: wallet-credentials-from-operator
    asserts:
      - equal:
          path: spec.template.spec.containers[0].env[0].valueFrom.secretKeyRef.name
          value: wallet-credentials-from-operator
      # The key is unchanged; only the Secret it is read from moves.
      - equal:
          path: spec.template.spec.containers[0].env[0].valueFrom.secretKeyRef.key
          value: databaseUrl
  - it: 'mounts the Atalla TLS volume when an environment supplies one'
    template: deployment.backend.yaml
    set:
      deployments:
        backend:
          volumeMounts:
            - name: atalla-tls
              mountPath: /etc/atalla/tls
              readOnly: true
          volumes:
            - name: atalla-tls
              secret:
                secretName: wallet-atalla
                defaultMode: 0400
    asserts:
      - equal:
          path: spec.template.spec.volumes[0].secret.secretName
          value: wallet-atalla
      - equal:
          path: spec.template.spec.containers[0].volumeMounts[0].mountPath
          value: /etc/atalla/tls
