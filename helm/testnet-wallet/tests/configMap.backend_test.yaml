suite: testnet-wallet backend - ConfigMap
templates:
  - configMap.backend.yaml
set:
  fullnameOverride: test-testnet-wallet
release:
  name: test-testnet-wallet
tests:
  # The HSM adapters run as their own Deployments (templates/hsm-adapter.yaml).
  # The backend does not read HSM_* or ATALLA_*, even with them enabled.
  - it: 'carries no HSM keys, even with the adapters enabled'
    set:
      hsmAdapter:
        issuer:
          enabled: true
        atalla:
          host: '10.0.0.1'
          port: 13506
          tls:
            secretName: wallet-atalla
    asserts:
      - notExists:
          path: data.HSM_ENABLED
      - notExists:
          path: data.ATALLA_HOST
      - equal:
          path: data.NODE_ENV
          value: production
