suite: testnet-wallet otel-collector - configmap
templates:
  - configMap.otel-collector.yaml
set:
  fullnameOverride: test-testnet-wallet
release:
  name: test-testnet-wallet
tests:
  - it: 'a collector ConfigMap is created by default'
    asserts:
      - hasDocuments:
          count: 1
      - isKind:
          of: ConfigMap
      - equal:
          path: metadata.name
          value: test-testnet-wallet-otel-collector

  - it: 'no ConfigMap is created when the collector is disabled'
    set:
      otelCollector:
        enabled: false
    asserts:
      - hasDocuments:
          count: 0

  - it: 'the OTLP receiver listens on both protocols'
    asserts:
      - matchRegex:
          path: data['config.yaml']
          pattern: 'grpc:\n        endpoint: 0\.0\.0\.0:4317'
      - matchRegex:
          path: data['config.yaml']
          pattern: 'http:\n        endpoint: 0\.0\.0\.0:4318'

  - it: 'the prometheus exporter converts resource attributes to labels'
    asserts:
      - matchRegex:
          path: data['config.yaml']
          pattern: 'endpoint: 0\.0\.0\.0:8889'
      # Without this, every replica emits the same label set and the samples
      # overwrite each other.
      - matchRegex:
          path: data['config.yaml']
          pattern: 'resource_to_telemetry_conversion:\n      enabled: true'

  - it: 'with no traces endpoint the traces pipeline exports to nop'
    asserts:
      - matchRegex:
          path: data['config.yaml']
          pattern: 'nop: \{\}'
      - matchRegex:
          path: data['config.yaml']
          pattern: 'exporters: \[nop\]'
      - notMatchRegex:
          path: data['config.yaml']
          pattern: 'otlp/traces'

  - it: 'a traces endpoint replaces nop with an OTLP exporter'
    set:
      otelCollector:
        traces:
          endpoint: core-tempo.monitoring.svc.cluster.local:4317
    asserts:
      - matchRegex:
          path: data['config.yaml']
          pattern: 'otlp/traces:\n    endpoint: "core-tempo\.monitoring\.svc\.cluster\.local:4317"'
      - matchRegex:
          path: data['config.yaml']
          pattern: 'exporters: \[otlp/traces\]'
      - notMatchRegex:
          path: data['config.yaml']
          pattern: 'nop:'

  - it: 'traces TLS can be turned on for a collector that terminates it'
    set:
      otelCollector:
        traces:
          endpoint: otel-gateway.example:4317
          insecure: false
    asserts:
      - matchRegex:
          path: data['config.yaml']
          pattern: 'tls:\n      insecure: false'

  - it: 'the collector exposes its own metrics for the second scrape endpoint'
    asserts:
      - matchRegex:
          path: data['config.yaml']
          pattern: 'prometheus:\n                host: 0\.0\.0\.0\n                port: 8888'

  - it: 'otelCollector.config replaces the generated config wholesale'
    set:
      otelCollector:
        # Deliberately nothing like the generated pipeline, so the assertions
        # below cannot pass by accident.
        config:
          receivers:
            otlp:
              protocols:
                grpc:
                  endpoint: 0.0.0.0:14317
          exporters:
            debug: {}
          service:
            pipelines:
              traces:
                receivers: [otlp]
                exporters: [debug]
    asserts:
      - matchRegex:
          path: data['config.yaml']
          pattern: '0\.0\.0\.0:14317'
      - notMatchRegex:
          path: data['config.yaml']
          pattern: 'memory_limiter'
      - notMatchRegex:
          path: data['config.yaml']
          pattern: 'health_check'

  - it: 'batch and memory limiter settings are overridable'
    set:
      otelCollector:
        batch:
          timeout: 1s
          sendBatchSize: 64
        memoryLimiter:
          limitPercentage: 70
          spikeLimitPercentage: 10
        metricExpiration: 2m
    asserts:
      - matchRegex:
          path: data['config.yaml']
          pattern: 'timeout: 1s'
      - matchRegex:
          path: data['config.yaml']
          pattern: 'send_batch_size: 64'
      - matchRegex:
          path: data['config.yaml']
          pattern: 'limit_percentage: 70'
      - matchRegex:
          path: data['config.yaml']
          pattern: 'spike_limit_percentage: 10'
      - matchRegex:
          path: data['config.yaml']
          pattern: 'metric_expiration: 2m'

  - it: 'the listeners follow the container ports, found by name'
    set:
      otelCollector:
        ports:
          - name: otlp-grpc
            containerPort: 14317
          - name: otlp-http
            containerPort: 14318
          - name: metrics
            containerPort: 18889
          - name: telemetry
            containerPort: 18888
          - name: health
            containerPort: 23133
    asserts:
      - matchRegex:
          path: data['config.yaml']
          pattern: 'grpc:\n        endpoint: 0\.0\.0\.0:14317'
      - matchRegex:
          path: data['config.yaml']
          pattern: 'http:\n        endpoint: 0\.0\.0\.0:14318'
      - matchRegex:
          path: data['config.yaml']
          pattern: 'prometheus:\n    endpoint: 0\.0\.0\.0:18889'
      - matchRegex:
          path: data['config.yaml']
          pattern: 'port: 18888'
      - matchRegex:
          path: data['config.yaml']
          pattern: 'health_check:\n    endpoint: 0\.0\.0\.0:23133'

  - it: 'a container without an otlp-grpc port fails the render'
    set:
      otelCollector:
        ports:
          - name: otlp-http
            containerPort: 4318
          - name: metrics
            containerPort: 8889
          - name: telemetry
            containerPort: 8888
          - name: health
            containerPort: 13133
    asserts:
      - failedTemplate:
          errorMessage: >-
            otelCollector.ports must contain a port named otlp-grpc — the
            collector config listens on it
