suite: testnet-wallet otel-collector - serviceMonitor
templates:
  - serviceMonitor.otel-collector.yaml
set:
  fullnameOverride: test-testnet-wallet
release:
  name: test-testnet-wallet
# Every test but the last runs against a cluster with the Prometheus Operator
# CRDs.
capabilities:
  apiVersions:
    - monitoring.coreos.com/v1/ServiceMonitor
tests:
  - it: 'a ServiceMonitor is created by default'
    asserts:
      - hasDocuments:
          count: 1
      - isKind:
          of: ServiceMonitor
      - equal:
          path: metadata.name
          value: test-testnet-wallet-otel-collector

  - it: 'it scrapes the service metrics and the collector own metrics'
    asserts:
      - lengthEqual:
          path: spec.endpoints
          count: 2
      - equal:
          path: spec.endpoints[0]
          value:
            port: metrics
            path: /metrics
            interval: 30s
      - equal:
          path: spec.endpoints[1]
          value:
            port: telemetry
            path: /metrics
            interval: 30s

  - it: 'it selects the collector pods'
    asserts:
      - equal:
          path: spec.selector.matchLabels
          value:
            app.kubernetes.io/name: test-testnet-wallet-otel-collector
            app.kubernetes.io/instance: test-testnet-wallet

  - it: 'the scrape interval is overridable on both endpoints'
    set:
      otelCollector:
        serviceMonitor:
          interval: 15s
    asserts:
      - equal:
          path: spec.endpoints[0].interval
          value: 15s
      - equal:
          path: spec.endpoints[1].interval
          value: 15s

  - it: 'no ServiceMonitor when it is turned off'
    set:
      otelCollector:
        serviceMonitor:
          enabled: false
    asserts:
      - hasDocuments:
          count: 0

  - it: 'no ServiceMonitor when the collector is disabled'
    set:
      otelCollector:
        enabled: false
    asserts:
      - hasDocuments:
          count: 0

  - it: 'it selects the Service by its own name when that differs'
    set:
      otelCollector:
        service:
          name: collector
    asserts:
      - equal:
          path: spec.selector.matchLabels
          value:
            app.kubernetes.io/name: test-testnet-wallet-collector
            app.kubernetes.io/instance: test-testnet-wallet
