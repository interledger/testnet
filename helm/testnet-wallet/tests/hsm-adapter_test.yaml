suite: testnet-wallet - HSM adapters
templates:
  - hsm-adapter.yaml
set:
  fullnameOverride: test-testnet-wallet
  hsmAdapter:
    atalla:
      host: '10.0.0.1'
      port: 13506
      tls:
        secretName: wallet-atalla
release:
  name: test-testnet-wallet
tests:
  - it: 'renders nothing by default'
    set:
      hsmAdapter:
        atalla:
          host: ''
          port: ''
    asserts:
      - hasDocuments:
          count: 0

  - it: 'renders one Deployment and one Service per enabled role'
    set:
      hsmAdapter:
        issuer:
          enabled: true
        merchant:
          enabled: true
    asserts:
      - hasDocuments:
          count: 4

  - it: 'runs the issuer adapter on its own image and port'
    set:
      hsmAdapter:
        issuer:
          enabled: true
    documentSelector:
      path: kind
      value: Deployment
    asserts:
      - equal:
          path: metadata.name
          value: test-testnet-wallet-hsm-adapter-issuer
      - equal:
          path: spec.template.spec.containers[0].image
          value: ghcr.io/interledger/test-wallet-hsm-adapter-issuer:v0.0.1
      # One HSM connection: never two pods at once.
      - equal:
          path: spec.replicas
          value: 1
      - equal:
          path: spec.strategy.type
          value: Recreate
      - equal:
          path: spec.template.spec.containers[0].ports[0].containerPort
          value: 50051
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: GRPC_PORT
            value: '50051'
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: ATALLA_HOST
            value: '10.0.0.1'
      # Numbers must reach the container as strings.
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: ATALLA_PORT
            value: '13506'
      - equal:
          path: spec.template.spec.containers[0].readinessProbe.tcpSocket.port
          value: grpc

  - it: 'gives a role its own HSM host when set'
    set:
      hsmAdapter:
        merchant:
          enabled: true
          atalla:
            host: '10.0.0.2'
    documentSelector:
      path: kind
      value: Deployment
    asserts:
      - equal:
          path: metadata.name
          value: test-testnet-wallet-hsm-adapter-merchant
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: ATALLA_HOST
            value: '10.0.0.2'
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: GRPC_PORT
            value: '50052'

  - it: 'selects only its own pods from the Service'
    set:
      hsmAdapter:
        merchant:
          enabled: true
    documentSelector:
      path: kind
      value: Service
    asserts:
      - equal:
          path: metadata.name
          value: test-testnet-wallet-hsm-adapter-merchant
      - equal:
          path: spec.selector["app.kubernetes.io/name"]
          value: test-testnet-wallet-hsm-adapter-merchant
      - equal:
          path: spec.ports[0].port
          value: 50052
      - equal:
          path: spec.ports[0].appProtocol
          value: grpc

  - it: 'mounts the Atalla TLS Secret group-readable for the node user'
    set:
      hsmAdapter:
        issuer:
          enabled: true
    documentSelector:
      path: kind
      value: Deployment
    asserts:
      - equal:
          path: spec.template.spec.volumes[0].secret.secretName
          value: wallet-atalla
      - equal:
          path: spec.template.spec.volumes[0].secret.defaultMode
          value: 0440
      - equal:
          path: spec.template.spec.securityContext.fsGroup
          value: 1000
      - equal:
          path: spec.template.spec.containers[0].volumeMounts[0].mountPath
          value: /etc/atalla/tls

  - it: 'drops the TLS volume and settings when TLS is off'
    set:
      hsmAdapter:
        issuer:
          enabled: true
        atalla:
          tls:
            enabled: false
            secretName: ''
    documentSelector:
      path: kind
      value: Deployment
    asserts:
      - notExists:
          path: spec.template.spec.volumes
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: ATALLA_TLS_ENABLED
            value: 'false'
      - notContains:
          path: spec.template.spec.containers[0].env
          content:
            name: ATALLA_SKIP_SERVER_IDENTITY_CHECK
            value: 'true'

  - it: 'fails the render without an Atalla host'
    set:
      hsmAdapter:
        issuer:
          enabled: true
        atalla:
          host: ''
    asserts:
      - failedTemplate:
          errorMessage: 'hsmAdapter.atalla.host or hsmAdapter.issuer.atalla.host is required when hsmAdapter.issuer.enabled is true'

  - it: 'fails the render without an Atalla port'
    set:
      hsmAdapter:
        merchant:
          enabled: true
        atalla:
          port: ''
    asserts:
      - failedTemplate:
          errorMessage: 'hsmAdapter.atalla.port is required when hsmAdapter.merchant.enabled is true'

  - it: 'fails the render with TLS on and no Secret'
    set:
      hsmAdapter:
        issuer:
          enabled: true
        atalla:
          tls:
            secretName: ''
    asserts:
      - failedTemplate:
          errorMessage: 'hsmAdapter.atalla.tls.secretName is required when hsmAdapter.atalla.tls.enabled is true'
