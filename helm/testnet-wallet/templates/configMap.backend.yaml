{{/*
The override adds the TELEMETRY_* and SERVICE_* keys to the ConfigMap the
contentMap builds when config.telemetry.enabled is true. See
testnet-wallet.telemetryData.

common.utils.merge merges maps deeply, so these keys join the contentMap's
`data` rather than replacing it.
*/}}
{{- define "testnet-wallet.backend.ConfigMap" -}}
{{- $top := first . }}
{{- $telemetry := include "testnet-wallet.telemetryData" (list $top "backend") }}
{{- if $telemetry }}
data:
{{- end }}
{{- with $telemetry }}
  {{- . | nindent 2 }}
{{- end }}
{{- end }}
{{- include "common.configMapper" (list . .Values.configMaps.backend "testnet-wallet.backend.ConfigMap") }}
