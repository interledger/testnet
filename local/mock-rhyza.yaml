# mock-rhyza: one container and one Postgres database in place of the Rhyza
# stack in local/rhyza.yaml. It serves Rhyza's Admin API, Open Payments
# resource and auth servers, IdP interaction API and ILP connector on the same
# host ports and hostnames, so the wallet backend runs unchanged against either.

configs:
  mock-rhyza-config:
    content: |
      log:
        level: ${MOCK_RHYZA_LOG_LEVEL:-debug}
      open_payments:
        url: ${RHYZA_OPEN_PAYMENTS_URL:-https://ilp.testnet.test}
      auth:
        url: ${RHYZA_AUTH_URL:-https://auth.testnet.test}
      idp:
        url: ${RHYZA_IDP_URL:-https://testnet.test/grant-interactions}
      webhooks:
        url: ${RHYZA_WEBHOOK_URL:-http://host.docker.internal:3003/webhooks}
      rates:
        source: ase
        url: ${RHYZA_EXCHANGE_RATES_URL:-http://host.docker.internal:3003/rates}
      seed_assets: ${MOCK_RHYZA_SEED_ASSETS:-[{code: EUR, scale: 2}, {code: USD, scale: 2}]}
      compat:
        path_name: ${MOCK_RHYZA_PATH_NAME:-strict}
        intent_expiry: ${MOCK_RHYZA_INTENT_EXPIRY:-strict}
      ilp:
        ilp_address: ${RHYZA_ILP_ADDRESS:-test.net}
        public_url: ${RHYZA_CONNECTOR_URL:-https://connector.testnet.test}
  mock-rhyza-secrets:
    content: |
      connection_string: postgres://mockrhyza:mockrhyza@postgres:5432/mockrhyza?sslmode=disable
      idp_secret: ${AUTH_IDENTITY_SERVER_SECRET:-dev_identity_server_secret}

x-mock-rhyza-router: &router
  traefik.enable: true
  traefik.docker.network: testnet

services:
  mock-rhyza-init-db:
    container_name: mock-rhyza-init-db-local
    image: 'postgres:15'
    networks:
      - testnet
    environment:
      PGHOST: postgres
      PGUSER: ${POSTGRES_USER:-postgres}
      PGPASSWORD: ${POSTGRES_PASSWORD:-password}
    depends_on:
      postgres:
        condition: service_healthy
    entrypoint: ['/bin/sh', '-c']
    command:
      - |
        psql -v ON_ERROR_STOP=1 -d postgres <<'SQL'
        SELECT 'CREATE ROLE mockrhyza LOGIN PASSWORD ''mockrhyza''' WHERE NOT EXISTS (SELECT FROM pg_roles WHERE rolname = 'mockrhyza')\gexec
        SELECT 'CREATE DATABASE mockrhyza OWNER mockrhyza' WHERE NOT EXISTS (SELECT FROM pg_database WHERE datname = 'mockrhyza')\gexec
        SQL

  mock-rhyza:
    container_name: mock-rhyza-local
    image: ${MOCK_RHYZA_IMAGE:-ghcr.io/interledger/mock-rhyza:0.4.0}
    restart: unless-stopped
    networks:
      - testnet
    extra_hosts:
      - host.docker.internal:host-gateway
      - testnet.test:host-gateway
      - api.testnet.test:host-gateway
      - auth.testnet.test:host-gateway
      - ilp.testnet.test:host-gateway
      - connector.testnet.test:host-gateway
    environment:
      MOCK_RHYZA_CONFIG_PATH: /etc/mock-rhyza/config.yaml
      MOCK_RHYZA_SECRETS_PATH: /etc/mock-rhyza/secrets.yaml
    configs:
      - source: mock-rhyza-config
        target: /etc/mock-rhyza/config.yaml
      - source: mock-rhyza-secrets
        target: /etc/mock-rhyza/secrets.yaml
    ports:
      - '3021:3001'
      - '3022:3002'
      - '3023:3003'
      - '3024:3004'
      - '4000:4000'
      - '${MOCK_RHYZA_CONTROL_PORT:-3099}:3099'
    depends_on:
      mock-rhyza-init-db:
        condition: service_completed_successfully
    labels:
      <<: *router
      traefik.http.routers.rhyza-admin.rule: Host(`rhyza-admin.testnet.test`)
      traefik.http.routers.rhyza-admin.entrypoints: websecure
      traefik.http.routers.rhyza-admin.tls: true
      traefik.http.routers.rhyza-admin.service: rhyza-admin
      traefik.http.services.rhyza-admin.loadbalancer.server.port: 3001
      traefik.http.routers.rhyza-op-resource.rule: Host(`ilp.testnet.test`)
      traefik.http.routers.rhyza-op-resource.entrypoints: websecure
      traefik.http.routers.rhyza-op-resource.tls: true
      traefik.http.routers.rhyza-op-resource.service: rhyza-op-resource
      traefik.http.services.rhyza-op-resource.loadbalancer.server.port: 3002
      traefik.http.routers.rhyza-op-auth.rule: Host(`auth.testnet.test`)
      traefik.http.routers.rhyza-op-auth.entrypoints: websecure
      traefik.http.routers.rhyza-op-auth.tls: true
      traefik.http.routers.rhyza-op-auth.service: rhyza-op-auth
      traefik.http.services.rhyza-op-auth.loadbalancer.server.port: 3003
      traefik.http.routers.rhyza-idp.rule: Host(`rhyza-idp.testnet.test`)
      traefik.http.routers.rhyza-idp.entrypoints: websecure
      traefik.http.routers.rhyza-idp.tls: true
      traefik.http.routers.rhyza-idp.service: rhyza-idp
      traefik.http.services.rhyza-idp.loadbalancer.server.port: 3004
      traefik.http.routers.rhyza-connector.rule: Host(`connector.testnet.test`)
      traefik.http.routers.rhyza-connector.entrypoints: websecure
      traefik.http.routers.rhyza-connector.tls: true
      traefik.http.routers.rhyza-connector.service: rhyza-connector
      traefik.http.services.rhyza-connector.loadbalancer.server.port: 4000
