# Scrapes the collector's two endpoints, as the chart's ServiceMonitor does on
# the cluster.
global:
  scrape_interval: 15s

scrape_configs:
  # The wallet's metrics, converted from OTLP.
  - job_name: otel-collector-metrics
    static_configs:
      - targets: ['otel-collector:8889']
  # The collector's own metrics, where a dropped batch shows up.
  - job_name: otel-collector-telemetry
    static_configs:
      - targets: ['otel-collector:8888']
