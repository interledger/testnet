# Entry point for the Rhyza local stack, with mock-rhyza in place of Rhyza.
#
# Same compose project as docker-compose.yml, so the shared services (traefik,
# postgres, redis, mockgatehub) are reused and only the Rafiki half is swapped.
# docker-compose.rhyza-full.yml runs Rhyza itself instead.
include:
  - traefik.yaml
  - postgres.yaml
  - redis.yaml
  - mockgatehub.yaml
  - mock-rhyza.yaml
  - observability.yaml
  - hsm-adapter.yaml

networks:
  testnet:
    driver: bridge
    ipam:
      config:
        - subnet: 10.5.0.0/24
          gateway: 10.5.0.1

volumes:
  pg-data:
  redis-data:
