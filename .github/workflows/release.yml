name: Create Release

on:
  workflow_dispatch:
    inputs:
      republish_version:
        description: 'Optional. Skip semantic-release and (re)publish Docker/Helm for an existing version. Leave empty for a normal release. Re-pushing Helm charts for an already published version changes their digest.'
        required: false
        type: string
        default: ''

permissions:
  contents: write
  issues: write
  pull-requests: write
  packages: write

jobs:
  validate:
    name: Validate branch
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Check branch is releasable
        run: |
          BRANCH="${{ github.ref_name }}"
          if [ "$BRANCH" != "main" ] && [ "$BRANCH" != "v1" ] && ! echo "$BRANCH" | grep -qE '^release/v[0-9]+\.[0-9]+$'; then
            echo "::error::Releases can only be created from 'main', 'v1' or 'release/vX.Y' branches. Current branch: $BRANCH"
            exit 1
          fi
          echo "Branch '$BRANCH' is valid for release."

      - name: Validate republish_version
        if: inputs.republish_version != ''
        env:
          VERSION: ${{ inputs.republish_version }}
          BRANCH: ${{ github.ref_name }}
        run: |
          if ! echo "$VERSION" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::republish_version must be a plain semver like 0.10.0 (no leading v). Got: $VERSION"
            exit 1
          fi
          if ! git rev-parse -q --verify "refs/tags/v${VERSION}" >/dev/null; then
            echo "::error::Tag v${VERSION} does not exist. Create a release first, or leave republish_version empty."
            exit 1
          fi
          if ! git merge-base --is-ancestor "v${VERSION}" HEAD; then
            echo "::error::Tag v${VERSION} is not on branch '$BRANCH'. Run the workflow from the branch that released it."
            exit 1
          fi
          # v1 and release/vX.Y share older history with main, so the ancestor
          # check alone would let them republish main's 0.x tags.
          case "$BRANCH" in
            v[0-9]*) LINE="${BRANCH#v}" ;;
            release/v*) LINE="${BRANCH#release/v}" ;;
            *) LINE="" ;;
          esac
          if [ -n "$LINE" ] && [ "${VERSION#"$LINE".}" = "$VERSION" ]; then
            echo "::error::Branch '$BRANCH' can only republish ${LINE}.x versions. Got: $VERSION"
            exit 1
          fi
          echo "Will republish Docker images and Helm charts for v${VERSION}."

      - name: Enforce patch-only on maintenance branch
        if: startsWith(github.ref_name, 'release/v') && inputs.republish_version == ''
        run: |
          BRANCH="${{ github.ref_name }}"
          MAJOR_MINOR="${BRANCH#release/v}"
          MAJOR="${MAJOR_MINOR%%.*}"
          MINOR="${MAJOR_MINOR##*.}"

          LAST_TAG=$(git tag -l "v${MAJOR}.${MINOR}.*" | sort -V | tail -1)
          if [ -z "$LAST_TAG" ]; then
            # No prior patch in this series — fall back to the ancestor tag the branch was cut from.
            # Without this fallback RANGE="HEAD" would scan all history and trip on historical feat: commits.
            LAST_TAG=$(git describe --tags --abbrev=0 HEAD 2>/dev/null)
            if [ -z "$LAST_TAG" ]; then
              echo "No tags found in repository — skipping commit range validation."
              exit 0
            fi
            echo "No existing v${MAJOR}.${MINOR}.x tags — validating commits since $LAST_TAG"
          else
            echo "Last tag in maintenance series: $LAST_TAG"
          fi
          RANGE="${LAST_TAG}..HEAD"

          SUBJECTS=$(git log --format="%s" $RANGE)
          BODIES=$(git log --format="%B" $RANGE)

          ERRORS=""

          if echo "$SUBJECTS" | grep -qE '^feat(\(.+\))?[!:]'; then
            ERRORS="${ERRORS}feat commits are not allowed on maintenance branches (only patch releases permitted).\n"
            ERRORS="${ERRORS}Offending commits:\n$(echo "$SUBJECTS" | grep -E '^feat(\(.+\))?[!:]')\n"
          fi

          if echo "$SUBJECTS" | grep -qE '^[a-z]+(\(.+\))?!:'; then
            ERRORS="${ERRORS}Breaking change commits (! notation) are not allowed on maintenance branches.\n"
            ERRORS="${ERRORS}Offending commits:\n$(echo "$SUBJECTS" | grep -E '^[a-z]+(\(.+\))?!:')\n"
          fi

          if echo "$BODIES" | grep -qE '^BREAKING[- ]CHANGE:'; then
            ERRORS="${ERRORS}BREAKING CHANGE footer is not allowed on maintenance branches.\n"
          fi

          if [ -n "$ERRORS" ]; then
            echo "::error::Maintenance branch validation failed for '$BRANCH':"
            printf "$ERRORS"
            exit 1
          fi

          echo "Validation passed — no major or minor commits found on '$BRANCH'."

  release:
    name: Semantic Release
    runs-on: ubuntu-latest
    needs: validate
    timeout-minutes: 10
    outputs:
      new_release_published: ${{ steps.semantic.outputs.new_release_published || steps.republish.outputs.new_release_published }}
      new_release_version: ${{ steps.semantic.outputs.new_release_version || steps.republish.outputs.new_release_version }}
      push_latest: ${{ steps.latest.outputs.push_latest }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Setup Node.js
        if: inputs.republish_version == ''
        uses: actions/setup-node@v4
        with:
          node-version: '24.13.1'
      - name: Install semantic-release
        if: inputs.republish_version == ''
        run: |
          npm install -g \
            semantic-release@25 \
            @semantic-release/commit-analyzer@13 \
            @semantic-release/release-notes-generator@14 \
            @semantic-release/github@12
      - name: Run semantic-release
        id: semantic
        if: inputs.republish_version == ''
        run: |
          # Compare the full tag set, not the globally highest tag. With parallel
          # lines (main 0.x and v1 1.x), sort -V | tail -1 stays on v1.* and would
          # miss a new v0.x release on main.
          TAGS_BEFORE=$(git tag -l 'v[0-9]*.[0-9]*.[0-9]*' | sort)
          semantic-release
          NEW_TAG=$(comm -13 <(echo "$TAGS_BEFORE") <(git tag -l 'v[0-9]*.[0-9]*.[0-9]*' | sort) | sort -V | tail -1)
          if [ -n "$NEW_TAG" ]; then
            echo "new_release_published=true" >> $GITHUB_OUTPUT
            echo "new_release_version=${NEW_TAG#v}" >> $GITHUB_OUTPUT
          else
            echo "new_release_published=false" >> $GITHUB_OUTPUT
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Republish existing version
        id: republish
        if: inputs.republish_version != ''
        env:
          VERSION: ${{ inputs.republish_version }}
        run: |
          echo "new_release_published=true" >> $GITHUB_OUTPUT
          echo "new_release_version=${VERSION}" >> $GITHUB_OUTPUT
      - name: Decide whether to move ":latest"
        id: latest
        if: steps.semantic.outputs.new_release_published == 'true' || inputs.republish_version != ''
        env:
          BRANCH: ${{ github.ref_name }}
          REPUBLISH: ${{ inputs.republish_version }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PUSH_LATEST=false
          if [ "$BRANCH" = "main" ]; then
            if [ -z "$REPUBLISH" ]; then
              # A fresh release on main is always the newest production version.
              PUSH_LATEST=true
            else
              # Republish: only if it's GitHub's "Latest" release. Main's history
              # holds legacy v1.x tags, so the newest git tag can't be used here.
              LATEST=$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName -q .tagName 2>/dev/null || true)
              [ "v${REPUBLISH}" = "$LATEST" ] && PUSH_LATEST=true
            fi
          fi
          echo "push_latest=${PUSH_LATEST}" >> $GITHUB_OUTPUT

  helm-publish:
    name: Publish Helm charts
    needs: release
    if: needs.release.outputs.new_release_published == 'true'
    uses: ./.github/workflows/helm-publish.yml
    with:
      tag_name: v${{ needs.release.outputs.new_release_version }}
    secrets:
      HELM_PUBLISH_TOKEN: ${{ secrets.HELM_PUBLISH_TOKEN }}

  publish:
    name: Publish Docker images
    runs-on: ubuntu-latest
    needs: release
    if: needs.release.outputs.new_release_published == 'true'
    timeout-minutes: 15
    strategy:
      matrix:
        package:
          - name: test-wallet-backend
            identifier: 'wallet:backend'
            path: packages/wallet/backend
          - name: test-wallet-frontend
            identifier: 'wallet:frontend'
            path: packages/wallet/frontend
            port: 4003
            cookie_name: testnet.cookie
            backend_url: https://api-wallet.interledger-test.dev
            open_payments_host: $ilp.interledger-test.dev/
            auth_host: https://auth.interledger-test.dev
            gatehub_env: sandbox
            theme: dark
          - name: test-wallet-frontend-cards
            identifier: 'wallet:frontend'
            path: packages/wallet/frontend
            port: 4003
            cookie_name: interledgercards.cookie
            backend_url: https://api.interledger.cards
            open_payments_host: $ilp.dev/
            auth_host: https://auth.interledger.cards
            gatehub_env: production
            theme: light
          - name: test-boutique-frontend
            identifier: 'boutique:frontend'
            path: packages/boutique/frontend
            api_base_url: 'https://api-boutique.interledger-test.dev'
            currency: 'USD'
            theme: light
          - name: test-boutique-frontend-jopacc
            identifier: 'boutique:frontend'
            path: packages/boutique/frontend
            api_base_url: 'https://api-boutique.jopacc.openpayments.directory'
            currency: 'JOD'
            theme: light
          - name: test-boutique-backend
            identifier: 'boutique:backend'
            path: packages/boutique/backend
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          ref: v${{ needs.release.outputs.new_release_version }}
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Compute image tags
        id: image_tags
        env:
          IMAGE: ghcr.io/${{ github.repository_owner }}/${{ matrix.package.name }}
          VERSION: v${{ needs.release.outputs.new_release_version }}
          PUSH_LATEST: ${{ needs.release.outputs.push_latest }}
        run: |
          {
            echo 'tags<<TAGS_EOF'
            echo "${IMAGE}:${VERSION}"
            # Decided in the release job: never from `v1`, never for an older republish.
            if [ "$PUSH_LATEST" = "true" ]; then
              echo "${IMAGE}:latest"
            fi
            echo TAGS_EOF
          } >> "$GITHUB_OUTPUT"

      - name: Docker build and push
        uses: docker/build-push-action@v6
        with:
          context: ./
          push: true
          file: ${{ matrix.package.path }}/Dockerfile.prod
          build-args: |
            ${{ matrix.package.identifier == 'boutique:frontend' && format('VITE_API_BASE_URL={0}', matrix.package.api_base_url) || '' }}
            ${{ matrix.package.identifier == 'boutique:frontend' && format('VITE_CURRENCY={0}', matrix.package.currency) || '' }}
            ${{ matrix.package.identifier == 'boutique:frontend' && format('VITE_THEME={0}', matrix.package.theme) || '' }}
            ${{ matrix.package.identifier == 'wallet:frontend' && format('PORT={0}', matrix.package.port) || '' }}
            ${{ matrix.package.identifier == 'wallet:frontend' && format('COOKIE_NAME={0}', matrix.package.cookie_name) || '' }}
            ${{ matrix.package.identifier == 'wallet:frontend' && format('NEXT_PUBLIC_BACKEND_URL={0}', matrix.package.backend_url) || '' }}
            ${{ matrix.package.identifier == 'wallet:frontend' && format('NEXT_PUBLIC_OPEN_PAYMENTS_HOST={0}', matrix.package.open_payments_host) || '' }}
            ${{ matrix.package.identifier == 'wallet:frontend' && format('NEXT_PUBLIC_AUTH_HOST={0}', matrix.package.auth_host) || '' }}
            ${{ matrix.package.identifier == 'wallet:frontend' && format('NEXT_PUBLIC_GATEHUB_ENV={0}', matrix.package.gatehub_env) || '' }}
            ${{ matrix.package.identifier == 'wallet:frontend' && format('NEXT_PUBLIC_THEME={0}', matrix.package.theme) || '' }}
          tags: ${{ steps.image_tags.outputs.tags }}
