name: Build hsm-server images

# This workflow publishes wallet images from the `hsm-server` branch.
# Each image carries the commit short hash as its tag. You can deploy the branch
# by hash, and you do not need a release.
# Note: `release.yml` publishes the release images. It is the only workflow that
# writes the `latest` tag.

on:
  push:
    branches:
      - hsm-server

permissions:
  contents: read
  packages: write

# Only the newest commit needs an image. This setting cancels an earlier run.
concurrency:
  group: hsm-server-images-${{ github.ref }}
  cancel-in-progress: true

jobs:
  publish:
    name: Publish ${{ matrix.package.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      # Each image builds on its own. A failure in one does not stop the other.
      fail-fast: false
      matrix:
        package:
          - name: test-wallet-backend
            identifier: 'wallet:backend'
            path: packages/wallet/backend
          - name: test-wallet-frontend
            identifier: 'wallet:frontend'
            path: packages/wallet/frontend
            port: 4003
            cookie_name: cards-playground.cookie
            backend_url: https://cards-playground-testnet-backend.interledger.tech
            open_payments_host: $cards-playground-ilp.interledger.tech
            auth_host: https://cards-playground-auth.interledger.tech
            gatehub_env: sandbox
            theme: dark
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Resolve image tag
        id: tag
        # This step takes the first 8 characters of the commit hash.
        # Do not use `git rev-parse --short` here. `core.abbrev` is not set, so git
        # scales the length by the number of objects. `actions/checkout` makes a
        # shallow clone, and that clone has a different number of objects. A fixed
        # length keeps the tag the same in CI and on a workstation.
        run: echo "short_sha=${GITHUB_SHA::8}" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker build and push
        uses: docker/build-push-action@v6
        with:
          context: ./
          push: true
          file: ${{ matrix.package.path }}/Dockerfile.prod
          build-args: |
            ${{ matrix.package.identifier == 'wallet:frontend' && format('PORT={0}', matrix.package.port) || '' }}
            ${{ matrix.package.identifier == 'wallet:frontend' && format('COOKIE_NAME={0}', matrix.package.cookie_name) || '' }}
            ${{ matrix.package.identifier == 'wallet:frontend' && format('NEXT_PUBLIC_BACKEND_URL={0}', matrix.package.backend_url) || '' }}
            ${{ matrix.package.identifier == 'wallet:frontend' && format('NEXT_PUBLIC_OPEN_PAYMENTS_HOST={0}', matrix.package.open_payments_host) || '' }}
            ${{ matrix.package.identifier == 'wallet:frontend' && format('NEXT_PUBLIC_AUTH_HOST={0}', matrix.package.auth_host) || '' }}
            ${{ matrix.package.identifier == 'wallet:frontend' && format('NEXT_PUBLIC_GATEHUB_ENV={0}', matrix.package.gatehub_env) || '' }}
            ${{ matrix.package.identifier == 'wallet:frontend' && format('NEXT_PUBLIC_THEME={0}', matrix.package.theme) || '' }}
          # The commit hash is the only tag. This workflow does not write the
          # `latest` tag, so a branch image cannot hide a release image.
          tags: ghcr.io/${{ github.repository_owner }}/${{ matrix.package.name }}:${{ steps.tag.outputs.short_sha }}
          # Each image has its own cache scope. One image cannot evict the other.
          cache-from: type=gha,scope=${{ matrix.package.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.package.name }}

      - name: Summarise
        run: |
          {
            echo '```'
            echo "ghcr.io/${{ github.repository_owner }}/${{ matrix.package.name }}:${{ steps.tag.outputs.short_sha }}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
